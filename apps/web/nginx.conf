server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA. Any path that is not a real file falls back to index.html so a
    # refresh on a client-side route does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api goes to the api container. This is what keeps the
    # browser talking only to its own origin: no CORS to configure, and
    # neither the LLM key nor the NKS key is ever sent to the browser.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming. Without these three, nginx buffers the whole response and
        # the answer arrives in one lump at the end -- which looks exactly like
        # streaming being broken, with nothing in any log to explain it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
